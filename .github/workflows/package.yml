# Every push to main rebuilds the Windows package and refreshes the release of the
# current version (from CMakeLists.txt): the zip asset is replaced and the tag moves
# to the pushed commit. A new version number creates a new release.
name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          archives: 'qtbase qtdeclarative qtsvg d3dcompiler_47'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Build and package
        shell: powershell
        run: ./scripts/package.ps1 -QtRoot "$env:QT_ROOT_DIR"

      - name: Update release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'project\(OmniLauncher VERSION ([0-9.]+)').Groups[1].Value
          $tag = "v$version"
          $zip = "dist/OmniLauncher-$version-win64.zip"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $zip --target $env:GITHUB_SHA --title "OmniLauncher $version" --notes "Baixe o zip, extraia e abra OmniLauncher.exe. Nada precisa ser instalado."
          } else {
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true | Out-Null
            gh release upload $tag $zip --clobber
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
