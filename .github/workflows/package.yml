# Every push to main rebuilds the Windows package and refreshes the release of the
# current version (from CMakeLists.txt): the zip asset is replaced and the tag moves
# to the pushed commit. A new version number creates a new release.
name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: package
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          archives: 'qtbase qtdeclarative qtsvg d3dcompiler_47'
          modules: 'qtshadertools qtimageformats'
          cache: true

      - name: Install Inno Setup
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      # Steamworks SDK for the Steam connection, from a private repository: Valve's SDK can't be
      # public. It holds public/steam/ and redistributable_bin/win64/ at its root (repository
      # variable STEAMWORKS_REPO, default <owner>/OmniLauncher-steamworks). Without the
      # STEAMWORKS_TOKEN secret the build leaves the feature out.
      - name: Check for the Steamworks SDK
        id: steamworks
        shell: bash
        run: echo "enabled=${{ secrets.STEAMWORKS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Fetch the Steamworks SDK
        if: steps.steamworks.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.STEAMWORKS_REPO || format('{0}/OmniLauncher-steamworks', github.repository_owner) }}
          token: ${{ secrets.STEAMWORKS_TOKEN }}
          path: .tools/steamworks

      - name: Build and package
        shell: powershell
        run: ./scripts/package.ps1 -QtRoot "$env:QT_ROOT_DIR"

      - name: Update release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = [regex]::Match((Get-Content -Raw CMakeLists.txt), 'project\(OmniLauncher VERSION ([0-9.]+)').Groups[1].Value
          $tag = "v$version"
          $zip = "dist/OmniLauncher-$version-win64.zip"
          $setup = "dist/OmniLauncher-Setup.exe"
          if (-not (Test-Path $setup)) { Write-Error "The installer was not built."; exit 1 }
          $notes = "Baixe **OmniLauncher-Setup.exe** e abra: instala só pro seu usuário, sem pedir administrador, com atalho no Menu Iniciar. Prefere sem instalar? Baixe o zip, extraia e abra OmniLauncher.exe. O launcher se atualiza sozinho nos dois casos."
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag "$zip#$env:GITHUB_SHA" "$setup#$env:GITHUB_SHA" --target $env:GITHUB_SHA --title "OmniLauncher $version" --notes $notes
          } else {
            # The asset label carries the commit: installed launchers compare it with their own.
            gh release upload $tag "$zip#$env:GITHUB_SHA" "$setup#$env:GITHUB_SHA" --clobber
            gh release edit $tag --notes $notes
            gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f sha=$env:GITHUB_SHA -F force=true | Out-Null
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
